    var p = vals.map(function (v) { return pctOf(v, e.max); }), b = [0, 0, 0, 0];
    p.forEach(function (x) { b[x < 40 ? 0 : x < 60 ? 1 : x < 80 ? 2 : 3]++; });
    e.stats = { avg: r1(mean(p)), best: p.length ? Math.max.apply(null, p) : null, n: p.length, buckets: b };
  }
  function recomputeSession(date) {
    var s = state.sessions.find(function (x) { return x.date === date; }); if (!s) return;
    var present = 0, marked = 0;
    Object.keys(state.att).forEach(function (sid) { var r = state.att[sid][date]; if (r !== undefined) { marked++; if (r) present++; } });
    s.presentCount = present; s.markedCount = marked;

    'mat-file': function (el) {
      var file = el.files && el.files[0], info = el.form.querySelector('#file-info'); if (!file) { info.textContent = 'Файл не выбран'; return; }
      var big = file.size > MAX_FILE; info.textContent = file.name + ', ' + fmtSize(file.size) + (big ? '. Больше 25 MB: добавьте ссылкой.' : ''); info.className = big ? 'text-sm text-danger' : 'text-sm text-ink';
      var t = el.form.elements.namedItem('title'); if (t && !t.value) t.value = file.name.replace(/\.[^.]+$/, '');
    },
    'restore': function (el) {
      var file = el.files && el.files[0]; if (!file) return;
      var r = new FileReader();
      r.onload = function () {
        try { var d = JSON.parse(r.result); if (!d || d.v !== 2 || !Array.isArray(d.topics)) throw new Error('bad'); state = d; state.baseExport = SEED && SEED.state ? SEED.state.exportedAt : null; saveLocal(); att.draft = null; render(); toast('Данные восстановлены из копии'); }
        catch (e) { toast('Это не похоже на резервную копию этого сайта.', true); }
        el.value = '';
      };
      r.readAsText(file);
    }
  };
  var INPUTS = {
    'sy-q': function (el) { sy.q = el.value; var b = $('#sy-list'); if (b) { b.innerHTML = syList(); icons(); } },
    'lib-q': function (el) { lib.q = el.value; var b = $('#lib-list'); if (b) { b.innerHTML = libList(); icons(); } },
    'qa-q': function (el) { qa.q = el.value; var b = $('#qa-list'); if (b) { b.innerHTML = qaList(); icons(); } }
  };

  var FORMS = {
    material: saveMaterial,
    subtopic: async function (f) {
      var title = val(f, 'title'), parent = f.getAttribute('data-parent'); if (!title) return showErr(f, 'Введите название подтемы.');
      var p = topicById(parent), maxOrder = children(parent).reduce(function (m, c) { return Math.max(m, c.order); }, 0);
      var t = { id: uid('t'), parentId: parent, title: title, kind: p && p.kind === 'math' ? 'math' : 'custom', order: maxOrder + 1 };
      state.topics.push(t); await persist([opSet('topics', t.id, docData(t))], 'Подтема добавлена');
      var inp = $('#st-title'); if (inp) inp.focus();
    },
    scores: async function (f) {
      var isNew = sc.id === 'new', e, prev;
      if (isNew) {
        var title = val(f, 'etitle'), date = val(f, 'edate'), max = Number(val(f, 'emax'));
        if (!title) return showErr(f, 'Укажите название олимпиады.'); if (!date) return showErr(f, 'Укажите дату.'); if (!(max > 0)) return showErr(f, 'Максимум баллов должен быть больше нуля.');
        e = { id: uid('e'), title: title, date: date, level: val(f, 'elevel'), max: max };
      } else e = state.exams.find(function (x) { return x.id === sc.id; });
      prev = state.scores[e.id] || {};
      var next = {}, bad = null;
      students().forEach(function (s) {
        var raw = val(f, 's:' + s.id).replace(',', '.'); if (raw === '') return;
        var v = Number(raw); if (isNaN(v) || v < 0 || v > e.max) { bad = bad || s.name; return; }
        next[s.id] = { score: v };
      });
      if (bad) return showErr(f, 'Проверьте балл: «' + bad + '». Допустимо от 0 до ' + num(e.max) + '.');
      if (isNew && !Object.keys(next).length) return showErr(f, 'Введите хотя бы один балл.');
      if (isNew) state.exams.push(e);
      state.scores[e.id] = next; recomputeExam(e);
      var ops = [opSet('exams', e.id, docData(e))];
      Object.keys(next).forEach(function (sid) { ops.push(opSet('scores', e.id + '_' + sid, { examId: e.id, uid: sid, score: next[sid].score, rank: next[sid].rank, total: next[sid].total })); });
      Object.keys(prev).forEach(function (sid) { if (!next[sid]) ops.push(opDel('scores', e.id + '_' + sid)); });
      busy(f, true); closeModal();
      await persist(ops, 'Баллы сохранены: ' + e.title);
    },
    ask: async function (f) {
      var title = val(f, 'title'), body = val(f, 'body'), by = myId();
      if (!by) return showErr(f, 'Сначала выберите себя в шапке сайта.'); if (!title) return showErr(f, 'Сформулируйте вопрос.'); if (!body) return showErr(f, 'Добавьте подробности: что именно непонятно.');
      var q = { id: uid('q'), topicId: val(f, 'topic') || null, authorId: by, title: title, body: body, createdAt: todayISO(), ts: Date.now(), resolved: false, acceptedId: null };
      state.questions.push(q);
      openModal(function () { return questionModal(q.id); }, { wide: true });
      await persist([opSet('questions', q.id, docData(q))], 'Вопрос опубликован');
    },
    answer: async function (f) {
      var body = val(f, 'body'), qid = f.getAttribute('data-q'), by = myId();
      if (!by) return showErr(f, 'Сначала выберите себя в шапке сайта.'); if (!body) return showErr(f, 'Напишите текст ответа.');
      var a = { id: uid('a'), questionId: qid, authorId: by, body: body, createdAt: todayISO(), ts: Date.now() };
      state.answers.push(a); await persist([opSet('answers', a.id, docData(a))], 'Ответ опубликован');
    },
    news: async function (f) {
      var title = val(f, 'title'); if (!title) return showErr(f, 'Укажите заголовок.');
      var n = { id: uid('n'), title: title, body: val(f, 'body'), pinned: f.elements.namedItem('pinned').checked, authorId: myId(), createdAt: todayISO(), ts: Date.now() };
      state.news.push(n); closeModal(); await persist([opSet('news', n.id, docData(n))], 'Объявление опубликовано');
    },
    deadline: async function (f) {
      var title = val(f, 'title'), date = val(f, 'date'); if (!title) return showErr(f, 'Укажите название.'); if (!date) return showErr(f, 'Укажите дату.');
      var d = { id: uid('d'), title: title, type: val(f, 'type'), date: date, description: val(f, 'description') || null, createdAt: todayISO(), ts: Date.now() };
      state.deadlines.push(d); closeModal(); await persist([opSet('deadlines', d.id, docData(d))], countdownText(d.date, d.title));
    },
    'student-add': function (f) {
      var name = val(f, 'name'), grade = val(f, 'grade');
      if (!name) return showErr(f, 'Укажите имя ученика.'); if (grade && !(Number(grade) >= 1 && Number(grade) <= 12)) return showErr(f, 'Класс должен быть от 1 до 12.');
      if (state.students.some(function (s) { return norm(s.name) === norm(name); })) return showErr(f, 'Такой ученик уже есть в списке.');
      state.students.push({ id: uid('s'), name: name, grade: grade ? Number(grade) : null }); saveLocal(); render(); toast(name + ' добавлен(а) в команду');
      var inp = $('#sa-name'); if (inp) inp.focus();
    },
    'student-edit': async function (f) {
      var id = f.getAttribute('data-id'), name = val(f, 'name'), grade = val(f, 'grade');
      if (!name) return showErr(f, 'Укажите имя.'); if (grade && !(Number(grade) >= 1 && Number(grade) <= 12)) return showErr(f, 'Класс должен быть от 1 до 12.');
      if (backend === 'firebase') {
        var u = fb.users.find(function (x) { return x.id === id; }); if (!u) return closeModal();
        u.name = name; u.grade = grade ? Number(grade) : null; if (f.elements.namedItem('role')) u.role = val(f, 'role');
        busy(f, true); closeModal();
        await persist([opSet('users', u.id, docData(u))], 'Сохранено');
        try { await fbLoadAll(); } catch (e) {} repaintAll();
      } else {
        var s = studentById(id); if (!s) return closeModal(); s.name = name; s.grade = grade ? Number(grade) : null; saveLocal(); closeModal(); render(); toast('Сохранено');
      }
    },
    settings: async function (f) {
      var team = val(f, 'teamName'); if (!team) return showErr(f, 'Укажите название сборной.');
      state.settings.teamName = team; if (backend === 'local') state.settings.captainName = val(f, 'captainName') || 'Капитан';
      await persist(backend === 'firebase' ? [opSet('config', 'team', { teamName: team })] : [], 'Настройки сохранены');
    },
    firebase: function (f) {
      var c = { apiKey: val(f, 'apiKey'), authDomain: val(f, 'authDomain'), projectId: val(f, 'projectId') };
      if (!c.apiKey || !c.projectId) return showErr(f, 'Заполните как минимум apiKey и projectId.');
      if (!c.authDomain) c.authDomain = c.projectId + '.firebaseapp.com';
      try { localStorage.setItem(FB_KEY, JSON.stringify(c)); localStorage.removeItem(FB_OFF_KEY); } catch (e) {}
      fbConfig = c;
      if (inClaude) { render(); toast('Ключи сохранены и попадут в экспорт. Здесь сайт продолжит работать локально.'); }
      else { toast('Ключи сохранены. Перезапуск…'); setTimeout(function () { location.reload(); }, 700); }
    },
    pin: async function (f) {
      var p = val(f, 'pin'); if (!/^\d{4,12}$/.test(p)) return showErr(f, 'PIN должен состоять из 4–12 цифр.');
      state.settings.pinHash = await hashPin(p); saveLocal(); render(); toast('PIN сохранён');
    },
    unlock: async function (f) { var p = val(f, 'pin'); if (!p) return showErr(f, 'Введите PIN.'); if ((await hashPin(p)) !== state.settings.pinHash) return showErr(f, 'Неверный PIN.'); setRole('captain'); },
    login: async function (f) {
      var email = val(f, 'email'), pw = f.elements.namedItem('password').value;
      if (!email || !pw) return showErr(f, 'Введите email и пароль.');
      busy(f, true, 'Вход…');
      try { await fb.auth.signInWithEmailAndPassword(email, pw); } catch (e) { busy(f, false); showErr(f, errText(e)); }
    },
    register: async function (f) {
      var name = val(f, 'name'), grade = val(f, 'grade'), email = val(f, 'email'), pw = f.elements.namedItem('password').value;
      if (!name) return showErr(f, 'Укажите имя и фамилию.'); if (grade && !(Number(grade) >= 1 && Number(grade) <= 12)) return showErr(f, 'Класс должен быть от 1 до 12.');
      if (!email || !pw) return showErr(f, 'Введите email и пароль.'); if (pw.length < 6) return showErr(f, 'Пароль должен быть не короче 6 символов.');
      busy(f, true, 'Регистрация…');
      pendingProfile = { name: name, grade: grade ? Number(grade) : null };
      try { await fb.auth.createUserWithEmailAndPassword(email, pw); } catch (e) { pendingProfile = null; busy(f, false); showErr(f, errText(e)); }
    }
  };

  /* =================================================================
     События и запуск
     ================================================================= */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]'); if (!el) return;
    var fn = ACTIONS[el.getAttribute('data-action')]; if (!fn) return;
    e.preventDefault();
    Promise.resolve().then(function () { return fn(el, e); }).catch(function (err) { console.error(err); toast(errText(err), true); });
  });
  document.addEventListener('change', function (e) { var el = e.target.closest('[data-change]'); if (el && CHANGES[el.getAttribute('data-change')]) CHANGES[el.getAttribute('data-change')](el); });
  document.addEventListener('input', function (e) { var el = e.target.closest('[data-input]'); if (el && INPUTS[el.getAttribute('data-input')]) INPUTS[el.getAttribute('data-input')](el); });
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-form]'); if (!f) return;
    e.preventDefault();
    var fn = FORMS[f.getAttribute('data-form')]; if (!fn) return;
    var er = f.querySelector('[data-error]') || (f.nextElementSibling && f.nextElementSibling.hasAttribute && f.nextElementSibling.hasAttribute('data-error') ? f.nextElementSibling : null);
    if (er) er.classList.add('hidden');
    Promise.resolve().then(function () { return fn(f); }).catch(function (x) { console.error(x); busy(f, false); showErr(f, errText(x)); });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal) closeModal(); });
  window.addEventListener('hashchange', function () { if (!$('#view')) return; route = readRoute(); armed = null; closeModal(); render(); window.scrollTo(0, 0); });

  var pendingProfile = null;
  function startApp() { renderShell(); route = readRoute(); render(); }

  async function bootFirebase() {
    $('#app').innerHTML = '<p style="padding:2rem;font-family:sans-serif;color:#56666C">Подключение к Firebase…</p>';
    try {
      await loadFirebaseSdk();
      fb.app = firebase.apps.length ? firebase.app() : firebase.initializeApp(fbConfig);
      fb.auth = firebase.auth(); fb.db = firebase.firestore();
    } catch (e) {
      console.error(e);
      renderAuth('Не удалось подключиться к Firebase: ' + errText(e) + ' Проверьте ключи или перейдите в локальный режим.');
      return;
    }
    fb.auth.onAuthStateChanged(async function (user) {
      if (!user) { fb.user = null; fb.profile = null; closeModal(); renderAuth(); return; }
      fb.user = user;
      $('#app').innerHTML = '<p style="padding:2rem;font-family:sans-serif;color:#56666C">Загрузка данных…</p>';
      try {
        var ref = fb.db.doc('users/' + user.uid), snap = await ref.get();
        if (!snap.exists) {
          var p = { name: (pendingProfile && pendingProfile.name) || (user.email || '').split('@')[0], grade: pendingProfile ? pendingProfile.grade : null, email: user.email, role: 'student', createdAt: todayISO() };
          await ref.set(p); fb.profile = Object.assign({ id: user.uid }, p);
        } else { fb.profile = Object.assign({ id: user.uid }, snap.data()); }
        pendingProfile = null;
        await fbLoadAll();
        startApp();
      } catch (e) {
        console.error(e);
        authMsg = 'Вход выполнен, но данные не загрузились: ' + errText(e);
        try { await fb.auth.signOut(); } catch (x) { renderAuth(); }
      }
    });
  }

  if (backend === 'firebase') bootFirebase();
  else { saveLocal(); startApp(); }
})();
</script>
</body>
</html>
